
[build-system]
# 75.3.4 should be max setuptools that 3.8.12 supports
# same w/ setuptools-scm 9.2.2 (used for installing data files)
requires = ["setuptools >= 75.3.4", "setuptools-scm>=9.2.2"]
build-backend = "setuptools.build_meta"
# TODO should i also be specifying pip / wheel here? (the other things in that section
# of my `savedeps` output. see exact-requirements.txt after ~2026-03-20)

[project]
name = "al_analysis"
# TODO dynamic version too? what does that do?
# required, and not sure if i can set up dynamically from git
version = "0.0.0"
# TODO try to get working w/ newer pythons (or test some dependencies w/ them first,
# probably starting w/ just build of olfsysm)
# make this exactly 3.8 (i've been using 3.8.12)?
requires-python = ">= 3.8"
dynamic = ["dependencies"]
readme = "README.md"

[project.optional-dependencies]
# The MB model (the `al-analysis` model step, `-s` without 'model'; al_analysis.mb_model):
# pyolfsysm, in the olfsysm repository since 2026-11, and the model-only dependencies (the
# rest of the dependencies are in exact-requirements.txt). Pinned for the newer python, as
# exact-requirements.txt is (exact-requirements-py38.txt has them for python 3.8).
model = [
    "olfsysm @ git+https://github.com/ejhonglab/olfsysm",
    "rastermap==1.0",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "natsort==8.4.0",
    "statsmodels==0.15.0",
    "patsy==1.0.3",
    "formulaic==1.2.2",
    "interface_meta==2.0.1",
    "wrapt==2.5.1",
]
dev = [
    # NOTE: keep >= pytest minversion below
    "pytest >= 8.3.5",
    # for running tests across multiple python/dependency versions (`tox`)
    "tox >= 4.21; python_version >= '3.9'",
    "tox-uv; python_version >= '3.9'",
]

[tool.setuptools]
packages = ["al_analysis"]
# editable installs seem to work fine so far
#py-modules = ["al_analysis", "mb_model", "al_util", "hong_logging", "load_antennal_csv",
    # TODO TODO change name of scripts dir so this isn't installing a global "scripts"
    # package. move everything under an al_analysis package dir, including scripts? any
    # other way to change name of package this is under, or directly provide the module
    # w/o a containing package?
    # TODO could consolidate all scripts / CLI entrypoints in one dir?
# (scripts.step_model_pn_apl was the one py-module here, until it moved to olfsysm, as
# pyolfsysm.step_model_pn_apl, with its `step_model_pn_apl` command, 2026-11)
#]
include-package-data = true

[tool.setuptools.dynamic]
# NOTE: this can not use -r / -e in lines in those files, which would prevent some of
# the old approaches I took (but could just have separate parallel files to install
# certain sets of custom things, if I really want)
# NOTE: these pins are now for a newer python (currently 3.14). the pins from the old
# python 3.8.12 environment are in exact-requirements-py38.txt (+ only used via the tox
# py38 env below, via requirements-py38-test.txt). to install with those deps under
# python 3.8: `pip install -r exact-requirements-py38.txt` then `pip install --no-deps .`
dependencies = {file = "exact-requirements.txt"}

# TODO reference requirements.txt? how to consolidate? seems that might not let me
# install editable?

# TODO repackage backup_rois.py under here?
[project.scripts]
al-analysis = "al_analysis.al_analysis:main"
plot-roi = "al_analysis.plot_roi:main"

csvinfo = "al_analysis.load_antennal_csv:csvinfo_cli"
# TODO delete?
#csvdiff = "al_analysis.load_antennal_csv:csvdiff_cli"

# (the model's `plot-dynamics` and `step_model_pn_apl` commands are olfsysm's, since
# 2026-11: installed with the `model` extra)

[tool.pytest.ini_options]
# TODO `minversion = "6.0"` (or whichever version. using 8.3.5, but prob doesn't
# matter much)? (for what? delete?)
minversion = "8.3.5"
#
# TODO -q already imply --no-header (not clear from -h output)?
# may want some of other opts to reduce output (no summary?)
# TODO some way to get --pdb non-capturing on breakpoints, but don't drop in to
# post-mortem debugger ever?
# TODO is there some way to quit out of all tests when exiting a breakpoint
# encountered on one test (e.g. via Ctrl-D)? (just run pytest w/ -x?)
#
# NOTE: will still likely need -s, as currently configured, if breakpoint i want to stop
# at is an explicit ipdb.set_trace() (or probably even breakpoint()/pdb.set_trace())
# internal to one of the tests. I think capturing is only disabled automatically if
# breakpoint()/pdb.set_trace() (and not ipdb.set_trace()) is called from directly within
# one of the test functions (--pdb may also? not sure how that interacts w/ using
# ipdb.set_trace()).
#
# how does pdbcls interact w/ PYTHONBREAKPOINT? if PYTHONBREAKPOINT=ipdb.set_trace,
# breakpoint() in a test will no longer automatically disable capturing (need to pass
# -s). without this env var set, both breakpoint() and pdb.set_trace() will
# automatically disable capturing.
# TODO try using conftest.py to manipulate os.environ based on ipython / ipdb
# availability? may not be able to directly manipulate environ there; instead may need
# something like: https://stackoverflow.com/questions/71418185/
#
# NOTE: --pdbcls=IPython.terminal.debugger:Pdb seems to not require ipdb installed,
# despite the debug interface seeming the same to me (it may require ipython installed,
# which is probably heavier. may prefer to find a way to reference ipdb itself?)
#
# TODO any reason NOT to just always -s (--capture=no)? could capture actually be
# useful for me, other than to just suppress output?
# TODO if ipdb is installed and configured w/ PYTHONBREAKPOINT, does this pdbcls
# override that? what happens if ipython (or however we got IPython.terminal.debugger)
# use this?
#
# TODO are -q and -vv at odds? i want to see name of test being run, but otherwise
# want less output
#
# NOTE: seems we must use :TerminalPdb instead of :Pdb, in order for tab complete to
# work
#
# could add doctest here. see hong2p/pytest.ini
addopts = "--no-header -q --tb=short --pdbcls=IPython.terminal.debugger:TerminalPdb -s -vv"
testpaths = [
    "test",
]
# TODO try instead keeping some on failure (as long as we also exit on failure?)? w/
# extra config to more aggressively clear the cache dir?
#
# pytest's builtin tmp_path fixture will create temp dirs under /tmp/pytest-of-<user>,
# and default retention policy ("all") does not clear their contents. The "none"
# retention policy will remove all of these temp dirs after test completion, regardless
# of test failure/success.
#
# Setting this to prevent disk space issues caused by just a few runs of
# test_mb_model.py (where system is not restarted in between, which would clear /tmp).
# NOTE: override by adding `-o tmp_path_retention_policy=all` to pytest CLI args.
tmp_path_retention_policy = "none"
# TODO try adding pytest-checkipdb? (seems like it's basically a linter to remind you of
# straggling breakpoints? just use a linter for that instead?)
filterwarnings = [
    # xarray==0.19 with modern setuptools (probably anything more recent than about
    # 60-64) will cause these warnings when pytest is collecting tests
    'ignore:distutils Version classes are deprecated. Use packaging.version instead.:DeprecationWarning',
    'ignore:pkg_resources is deprecated as an API.:DeprecationWarning',
    'ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning',
]

# Plain `pytest` just runs in the current environment. `tox` runs the tests in all of
# the envs below (`tox -e py38` / `tox -e current` for just one). Extra args after `--`
# are passed to pytest, e.g. `QUICK=1 tox -e py38 -- -k test_vector_thr`.
# Requires `pip install -e .[dev]` (for tox + tox-uv). tox-uv will download python 3.8
# if needed.
[tool.tox]
requires = ["tox >= 4.21", "tox-uv"]
env_list = ["py38", "current"]

[tool.tox.env_run_base]
# tox otherwise strips most env vars. QUICK/PLOT used by test_mb_model.py, HONG2P_* /
# HONG_NAS used by hong2p to find data.
pass_env = [
    "QUICK", "PLOT", "HONG2P_*", "HONG_NAS", "MB_MODEL_USE_LR_CACHE", "HARDCODE_LR",
]

[tool.tox.env_run_base.set_env]
# breakpoint() calls are disabled by default (they would otherwise fail tests in
# `tox -p` runs, which have no stdin, or end the whole session in some cases). set
# TOX_PYTHONBREAKPOINT (e.g. =ipdb.set_trace) in calling environment to override.
# PYTHONBREAKPOINT itself is not used for that, since ~/.bashrc sets it globally.
PYTHONBREAKPOINT = "{env:TOX_PYTHONBREAKPOINT:0}"
# separate pytest temp root for each env, so concurrent runs (with
# tmp_path_retention_policy="none" above) don't delete each other's tmp_path dirs. not
# using --basetemp for that, since pytest only deletes its own (numbered) basetemp dirs
# at the end of each run, and some tests write tens of GB.
PYTEST_DEBUG_TEMPROOT = "{env_tmp_dir}"

# Oldest supported versions: python 3.8 + pins from exact-requirements-py38.txt (via
# requirements-py38-test.txt, which excludes the local packages below).
[tool.tox.env.py38]
base_python = ["python3.8"]
# installing this package normally would also install deps from exact-requirements.txt
# (pinned for newer python), so it is instead installed w/o deps in commands_pre
skip_install = true
# so pip is available for commands_pre
uv_seed = true
deps = ["-r requirements-py38-test.txt"]
# Local checkouts of my other packages (not in requirements-py38-test.txt), installed
# w/o deps (all their deps should already be pinned above). Reinstalled each run, so
# changes in those repos are tested. olfsysm not editable, as an editable install
# would put the py3.8 compiled extension in the olfsysm source dir.
commands_pre = [
    ["python", "-m", "pip", "install", "-q", "--no-deps",
        "-e", "{tox_root}/../hong2p",
        "-e", "{tox_root}/../drosolf",
        "-e", "{tox_root}/../natmix",
        "{tox_root}/../olfsysm",
        "-e", "{tox_root}",
    ],
]
commands = [
    ["pytest", { replace = "posargs", extend = true }],
]

# The existing ./venv, as-is (tox does not install anything into it)
[tool.tox.env.current]
skip_install = true
allowlist_externals = ["{tox_root}/venv/bin/python"]
commands = [
    ["{tox_root}/venv/bin/python", "-m", "pytest",
        { replace = "posargs", extend = true }
    ],
]
